project:
  type: book
  output-dir: _book-lab
  pre-render:
    - ./scripts/prepare-book-output.sh _book-lab
  post-render:
    - ./scripts/sync-book-assets.sh _book-lab

book:
  title: "Computational Geography"
  subtitle: "Laboratory"
  author: "Paul Hobson"
  search: true
  chapters:
    - index.qmd
    - advanced-investigations/index.qmd
    - laboratory/index.qmd
    - laboratory/sar-fundamentals-and-applications.qmd
    - laboratory/insar-deformation-monitoring.qmd
    - laboratory/gravity-remote-sensing-grace.qmd
    - laboratory/passive-microwave-radiometry.qmd
    - laboratory/rock-weathering-and-soil-formation.qmd
    - laboratory/soil-erosion-and-the-rusle.qmd
    - laboratory/shallow-landslides-and-slope-stability.qmd
    - laboratory/sediment-transport-in-rivers.qmd
    - laboratory/channel-morphology-and-hydraulic-geometry.qmd
    - laboratory/wave-dynamics-and-nearshore-transformation.qmd
    - laboratory/longshore-sediment-transport-and-coastal-budgets.qmd
    - laboratory/sea-level-storm-surge-and-coastal-morphodynamics.qmd
    - laboratory/urban-heat-island-dynamics.qmd
    - laboratory/urban-ventilation-and-pollutant-dispersion.qmd
    - laboratory/transportation-network-analysis.qmd
    - laboratory/accessibility-and-travel-demand-modeling.qmd
    - laboratory/land-use-change-modeling.qmd
    - laboratory/urban-scaling-laws-and-city-structure.qmd
    - laboratory/demographic-spatial-dynamics.qmd
    - laboratory/reservoir-operations-and-mass-balance.qmd
    - laboratory/stochastic-streamflow-and-drought-risk.qmd
    - laboratory/dissolved-oxygen-dynamics-and-the-streeter-phelps-model.qmd
    - laboratory/nutrient-dynamics-and-lake-eutrophication.qmd
    - laboratory/sediment-and-contaminant-transport-in-rivers.qmd
    - laboratory/groundwater-contaminant-plumes.qmd
    - laboratory/pump-and-treat-and-in-situ-remediation.qmd
    - laboratory/bayesian-inference-for-environmental-models.qmd
    - laboratory/regression-for-continuous-spatial-variables.qmd
    - laboratory/dimensionality-reduction-for-high-dimensional-geographic-data.qmd
    - laboratory/ensemble-forecasting-and-uncertainty-quantification.qmd
    - laboratory/the-kalman-filter-and-sequential-data-assimilation.qmd
    - laboratory/satellite-data-assimilation-in-environmental-models.qmd
