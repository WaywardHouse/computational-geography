    - laboratory/Land-Use-Change-and-Deforestation.qmd
    - laboratory/Photosynthesis-and-Gross-Primary-Production.qmd
    - laboratory/Ocean-Carbon-Uptake-and-Air-Sea-Exchange.qmd
    - laboratory/Soil-Carbon-Storage-and-Decomposition.qmd
    - laboratory/Methanogenesis-in-Anaerobic-Environments.qmd

format:
  html:
    theme: none
    css:
      - assets/css/quarto-wayward.css
    html-math-method: katex
    toc: true
    number-sections: false
    include-in-header:
      - assets/includes/quarto-head.html
    include-after-body:
      - assets/includes/quarto-body.html

execute:
  freeze: auto
