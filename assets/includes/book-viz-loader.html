<!-- Wayward House — comp-geo viz runtime loader
     Dynamically resolves the correct root-relative path to core.js so
     charts render both on the book's own *.pages.dev subdomain and
     through the hub proxy at wayward.house/computational-geography/. -->
<script>
(function () {
  // Quarto always emits at least one script with a relative path into
  // site_libs/.  We use that to infer the depth from this page to the
  // book root, then load core.js from assets/js/.
  var anchor = document.querySelector('script[src*="site_libs/"]');
  if (!anchor) return;
  var base = anchor.getAttribute('src').replace(/site_libs\/.*$/, '');
  var s = document.createElement('script');
  s.type = 'module';
  s.src = base + 'assets/js/core.js';
  document.head.appendChild(s);
})();
</script>
