project:
  type: book
  output-dir: _book-methods
  pre-render:
    - ./scripts/prepare-book-output.sh _book-methods
  post-render:
    - ./scripts/sync-book-assets.sh _book-methods

book:
  title: "Computational Geography"
  subtitle: "Methods Reference"
  author: "Paul Hobson"
  search: true
  chapters:
    - index.qmd
    - methods-and-tools/index.qmd
    - part: "Part 1: Foundations"
      chapters:
        - methods-and-tools/how-to-choose-a-model.qmd
        - methods-and-tools/how-to-validate-a-model.qmd
    - part: "Part 2: Quantifying Uncertainty"
      chapters:
        - methods-and-tools/uncertainty-propagation-and-ensembles.qmd
        - methods-and-tools/simulation-paradigms.qmd
    - part: "Part 3: Advanced Inference"
      chapters:
        - methods-and-tools/bayesian-updating-and-geographic-inference.qmd
        - methods-and-tools/causal-inference-for-geographic-questions.qmd
    - part: "Part 4: Optimization"
      chapters:
        - methods-and-tools/decision-models-and-optimization.qmd

format:
  html:
    theme: none
    css:
      - assets/css/quarto-wayward.css
    html-math-method: katex
    toc: true
    number-sections: false
    include-in-header:
      - assets/includes/quarto-head.html
    include-before-body:
      - assets/includes/quarto-book-nav.html

    include-after-body:
      - assets/includes/quarto-body.html

execute:
  freeze: auto
