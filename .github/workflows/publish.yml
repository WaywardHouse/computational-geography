name: Publish Computational Geography Clusters
on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jupyter nbformat nbclient
          # Add your specific science libraries here if the render fails on imports:
          # python3 -m pip install numpy pandas matplotlib

      - name: Render All Clusters
        run: |
          # 1. CLEAN: Remove any carriage returns (\r) from the entire repo
          # This fixes the 'Failed to spawn' error for Quarto's pre-render scripts
          find . -type f -not -path '*/.*' -exec sed -i 's/\r$//' {} +

          # 2. PERMISSIONS: Ensure scripts are executable
          chmod +x ./scripts/*.sh

          # 3. EXECUTE: Run the cluster scripts using explicit bash calls
          bash ./scripts/render-core-book.sh
          bash ./scripts/render-topic-libraries.sh
          bash ./scripts/render-laboratory.sh

      - name: Check Output Folders
        run: |
          echo "Checking for rendered output folders..."
          ls -d _book* || echo "No _book folders found!"

      - name: Deploy Core Book
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.WAYWARD_PUBLISH_TOKEN }}
        with:
          source-directory: '_book-core'
          destination-github-username: 'WaywardHouse'
          destination-repository-name: 'waywardhouse.github.io'
          target-directory: 'learn/computational-geography/core'
          user-email: github-actions@github.com
          target-branch: main

      - name: Deploy Laboratory
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.WAYWARD_PUBLISH_TOKEN }}
        with:
          source-directory: '_book-lab'
          destination-github-username: 'WaywardHouse'
          destination-repository-name: 'waywardhouse.github.io'
          target-directory: 'learn/computational-geography/lab'
          user-email: github-actions@github.com
          target-branch: main
