# Copy this file to waywardhouse-computational-geography/.github/workflows/publish.yml
#
# Requires secret: WAYWARD_PUBLISH_TOKEN (same PAT used in waywardhouse-site)
# The PAT needs write access to waywardhouse/waywardhouse.github.io
#
# Output dir in _quarto.yml must be: _book
# Target URL will be: wayward.house/learn/computational-geography/core/
#
# Notes:
# - The pre-render script (scripts/prepare-book-output.sh) uses Perl — available by default on ubuntu-latest
# - The post-render script (scripts/sync-book-assets.sh) copies from assets/ — must be present in the repo
# - execute: freeze: auto must be set in _quarto.yml and _freeze/ must be committed to avoid
#   needing Python/R installed in CI. If freeze files are missing, add a Python setup step.

name: Publish Computational Geography Book
on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WAYWARD_PUBLISH_TOKEN }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy to waywardhouse.github.io/learn/computational-geography/core
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2
        env:
          API_TOKEN_GITHUB: ${{ secrets.WAYWARD_PUBLISH_TOKEN }}
        with:
          source-directory: '_book'
          destination-github-username: 'waywardhouse'
          destination-repository-name: 'waywardhouse.github.io'
          target-directory: 'learn/computational-geography/core'
          user-email: github-actions@github.com
          target-branch: main
          # Protect the main site and other books from being overwritten
          arguments: --exclude=articles/ --exclude=learn/maths/ --exclude=assets/ --exclude=CNAME
