name: Publish Computational Geography Clusters
on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render All Clusters
        run: |
          # 1. Clean ALL files in the repository of Windows line endings
          # This ensures Quarto's pre-render scripts are readable by Linux
          find . -type f -not -path '*/.*' -exec sed -i 's/\r$//' {} +

          # 2. Ensure the scripts folder is executable
          chmod +x ./scripts/*.sh

          # 3. Run your custom render scripts
          # Note: These scripts trigger 'quarto render', which in turn 
          # triggers the pre-render scripts now that they are cleaned.
          bash ./scripts/render-core-book.sh
          bash ./scripts/render-topic-libraries.sh
          bash ./scripts/render-laboratory.sh

      - name: Deploy Core Book
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.WAYWARD_PUBLISH_TOKEN }}
        with:
          source-directory: '_book-core'
          destination-github-username: 'WaywardHouse'
          destination-repository-name: 'waywardhouse.github.io'
          target-directory: 'learn/computational-geography/core'
          user-email: github-actions@github.com
          target-branch: main

      - name: Deploy Laboratory
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.WAYWARD_PUBLISH_TOKEN }}
        with:
          source-directory: '_book-lab'
          destination-github-username: 'WaywardHouse'
          destination-repository-name: 'waywardhouse.github.io'
          target-directory: 'learn/computational-geography/lab'
          user-email: github-actions@github.com
          target-branch: main
